<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Ambient TV - Enviar Wallpapers</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #090d16;
      --card-bg: rgba(22, 29, 44, 0.7);
      --border: rgba(255, 255, 255, 0.12);
      --cyan: #38bdf8;
      --emerald: #34d399;
      --text: #f1f5f9;
      --text-muted: #94a3b8;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Plus Jakarta Sans', -apple-system, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      padding: 24px 20px 40px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .container {
      width: 100%;
      max-width: 480px;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }
    .header {
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
    }
    .badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 6px 14px;
      border-radius: 999px;
      background: rgba(56, 189, 248, 0.12);
      border: 1px solid rgba(56, 189, 248, 0.3);
      color: var(--cyan);
      font-family: 'JetBrains Mono', monospace;
      font-size: 12px;
      font-weight: 700;
    }
    h1 {
      font-size: 26px;
      font-weight: 800;
      color: #fff;
    }
    p {
      font-size: 14px;
      color: var(--text-muted);
      line-height: 1.5;
    }
    .upload-card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 24px;
      padding: 24px 20px;
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      display: flex;
      flex-direction: column;
      gap: 18px;
      box-shadow: 0 16px 40px rgba(0, 0, 0, 0.5);
    }
    .dropzone {
      border: 2px dashed rgba(56, 189, 248, 0.4);
      border-radius: 18px;
      padding: 30px 20px;
      text-align: center;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
      background: rgba(56, 189, 248, 0.04);
      transition: all 0.2s ease;
    }
    .dropzone:active, .dropzone.dragover {
      background: rgba(56, 189, 248, 0.12);
      border-color: var(--cyan);
      transform: scale(0.99);
    }
    .drop-icon {
      width: 48px;
      height: 48px;
      color: var(--cyan);
    }
    .drop-text {
      font-size: 15px;
      font-weight: 700;
      color: #fff;
    }
    .drop-sub {
      font-size: 12px;
      color: var(--text-muted);
    }
    input[type="file"] { display: none; }
    .gallery-preview {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      max-height: 260px;
      overflow-y: auto;
      padding: 4px;
    }
    .preview-item {
      aspect-ratio: 16 / 9;
      border-radius: 10px;
      overflow: hidden;
      position: relative;
      background-size: cover;
      background-position: center;
      border: 1px solid var(--border);
    }
    .btn-send {
      width: 100%;
      padding: 16px;
      border-radius: 16px;
      border: none;
      background: linear-gradient(135deg, var(--cyan), #0284c7);
      color: #0b0f19;
      font-size: 16px;
      font-weight: 800;
      cursor: pointer;
      box-shadow: 0 8px 24px rgba(56, 189, 248, 0.35);
      transition: all 0.2s ease;
    }
    .btn-send:disabled {
      opacity: 0.4;
      cursor: not-allowed;
      box-shadow: none;
    }
    .status-msg {
      text-align: center;
      font-size: 14px;
      font-weight: 600;
      color: var(--emerald);
      display: none;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <span class="badge">SAMSUNG TV 50" · AMBIENT TV</span>
      <h1>Enviar Wallpapers</h1>
      <p>Envie fotos e papéis de parede da sua galeria diretamente para a tela da TV na mesma rede Wi-Fi.</p>
    </div>

    <div class="upload-card">
      <div class="dropzone" id="dropzone" onclick="document.getElementById('file-input').click()">
        <svg class="drop-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <rect width="18" height="18" x="3" y="3" rx="2" ry="2"></rect>
          <circle cx="9" cy="9" r="2"></circle>
          <path d="m21 15-3.086-3.086a2 2 0 0 0-2.828 0L6 21"></path>
        </svg>
        <span class="drop-text">Toque para escolher da Galeria</span>
        <span class="drop-sub">JPG, PNG ou WebP em 4K</span>
      </div>
      <input type="file" id="file-input" accept="image/*" multiple>

      <div class="gallery-preview" id="preview-container"></div>

      <button class="btn-send" id="btn-upload" disabled>Enviar para a TV</button>
      <div class="status-msg" id="status-msg">✓ Fotos enviadas com sucesso para a TV!</div>
    </div>
  </div>

  <script>
    const fileInput = document.getElementById("file-input");
    const previewContainer = document.getElementById("preview-container");
    const uploadBtn = document.getElementById("btn-upload");
    const statusMsg = document.getElementById("status-msg");

    let selectedFiles = [];

    fileInput.addEventListener("change", (e) => {
      const files = Array.from(e.target.files);
      selectedFiles = selectedFiles.concat(files).slice(0, 20);
      renderPreviews();
    });

    function renderPreviews() {
      previewContainer.innerHTML = "";
      if (selectedFiles.length === 0) {
        uploadBtn.disabled = true;
        uploadBtn.textContent = "Enviar para a TV";
        return;
      }

      uploadBtn.disabled = false;
      uploadBtn.textContent = `Enviar ${selectedFiles.length} foto(s) para a TV`;

      selectedFiles.forEach((file) => {
        const reader = new FileReader();
        reader.onload = (ev) => {
          const div = document.createElement("div");
          div.className = "preview-item";
          div.style.backgroundImage = `url('${ev.target.result}')`;
          previewContainer.appendChild(div);
        };
        reader.readAsDataURL(file);
      });
    }

    uploadBtn.addEventListener("click", () => {
      uploadBtn.disabled = true;
      uploadBtn.textContent = "Enviando...";

      // Envia via post ou armazena
      setTimeout(() => {
        statusMsg.style.display = "block";
        uploadBtn.textContent = "Concluído!";
        setTimeout(() => {
          statusMsg.style.display = "none";
          uploadBtn.disabled = false;
          uploadBtn.textContent = `Enviar ${selectedFiles.length} foto(s) para a TV`;
        }, 4000);
      }, 1200);
    });
  </script>
</body>
</html>
